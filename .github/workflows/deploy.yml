name: Deploy to GitHub Pages

# La publicación SIEMPRE sale de `main`. No es una preferencia: **GitHub Pages
# rechaza la publicación si el flujo no se origina en la rama principal** —
# comprobado a base de intentos: los lanzados desde la rama de vista previa fallaban
# una y otra vez, y el mismo trabajo lanzado desde `main` funcionaba. Así que la
# vista previa NO se publica empujando a su rama: se publica lanzando esto a mano
# desde `main` y diciendo QUÉ rama previsualizar (`vista`).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vista:
        description: 'Rama o commit a publicar como vista previa (vacío = la que haya puesta; "ninguna" = retirarla)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Lo usan las pruebas y el vigilante para saber contra qué URL mirar.
      hay_vista: ${{ steps.vista.outputs.hay }}
    steps:
      # Red de seguridad: si alguien vuelve a poner un disparador desde otra rama,
      # esto lo para con una explicación, en vez de dejar un fallo de publicación
      # difícil de entender (que es exactamente lo que ha pasado al construir esto).
      - name: La publicación tiene que salir de main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Este flujo se ha lanzado desde «${{ github.ref_name }}»."
            echo "GitHub Pages RECHAZA la publicación si no sale de la rama principal:"
            echo "desde otra rama, la compilación pasa y el despliegue falla."
            echo "Para publicar una vista previa, lánzalo desde main con el campo 'vista'."
            exit 1
          fi
      # La app REAL se compila SIEMPRE desde `main`, sea cual sea la rama que haya
      # disparado esto. Sin este `ref`, un push a la vista previa compilaría la
      # vista previa y la publicaría en la URL que usa el grupo: exactamente lo
      # que esta opción existe para evitar. No quitar.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_BASE_PATH: /FitClub/

      - name: ¿Hay que publicar una vista previa?
        id: vista
        env:
          # El campo 'vista' manda. Si viene vacío se usa la variable del repositorio
          # (VISTA_PREVIA), para que la vista previa NO se caiga cada vez que se
          # publica la app desde main: antes se caía sola en cada publicación y
          # había que volver a publicarla a mano. Con 'ninguna' se retira.
          RAMA: ${{ inputs.vista || vars.VISTA_PREVIA }}
        run: |
          rama="$RAMA"
          if [ "${{ inputs.vista }}" = "ninguna" ]; then rama=""; fi
          if [ -n "$rama" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
            echo "rama=$rama" >> "$GITHUB_OUTPUT"
            echo "Vista previa de: $rama"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "Sin vista previa: se publica solo la app real."
          fi

      - uses: actions/checkout@v4
        if: steps.vista.outputs.hay == 'si'
        with:
          ref: ${{ steps.vista.outputs.rama }}
          path: _vista

      # GitHub Pages publica UN sitio por repositorio (cada despliegue reemplaza el
      # sitio entero), así que la vista previa no se puede desplegar por separado:
      # viaja dentro del MISMO despliegue, en una carpeta de más abajo.
      - name: Compilar la vista previa en /preview/
        if: steps.vista.outputs.hay == 'si'
        run: |
          cd _vista
          npm ci
          VITE_BASE_PATH=/FitClub/preview/ VITE_BUILD_ID="vista-${GITHUB_SHA::8}" \
            npx vite build --outDir "$GITHUB_WORKSPACE/dist/preview" --emptyOutDir
          # El marcador es el de `main` (ruta absoluta), no el de la rama en
          # pruebas: una vista previa no debería poder quitarse su propio aviso.
          node "$GITHUB_WORKSPACE/scripts/marcar-vista-previa.mjs" "$GITHUB_WORKSPACE/dist/preview"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Estas dos comprobaciones son la red de seguridad de todo el invento: si el
      # aviso no se aplica, la vista previa es indistinguible de la real; y si se
      # aplica a la real, el grupo ve el aviso. Los dos fallos son peores que no
      # tener vista previa, así que aquí se para el despliegue.
      - name: La vista previa lleva su aviso
        if: steps.vista.outputs.hay == 'si'
        run: |
          if ! grep -q 'aviso-vista-previa' dist/preview/index.html; then
            echo "La vista previa se ha compilado SIN su aviso: no se publica."
            exit 1
          fi
          echo "La vista previa lleva su aviso."

      - name: La app real NO lleva el aviso
        run: |
          if grep -q 'aviso-vista-previa' dist/index.html; then
            echo "La marca de vista previa ha acabado en la app REAL: no se publica."
            exit 1
          fi
          echo "La app real está limpia."

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Qué se va a publicar
        run: |
          echo "app real:     $(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)"
          if [ -f dist/preview/index.html ]; then
            echo "vista previa: $(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/preview/index.html | head -1) en /preview/"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-tests:
    # Corre DESPUÉS de desplegar, contra la web real ya publicada.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    env:
      # Si lo que se acaba de publicar es la VISTA PREVIA, todo mira ahí: es lo que
      # hay que comprobar antes de que lo vea nadie. Define la URL una sola vez para
      # que las tres comprobaciones no puedan discrepar entre sí.
      BASE_URL: ${{ needs.build.outputs.hay_vista == 'si' && 'https://vilacos-source.github.io/FitClub/preview/' || 'https://vilacos-source.github.io/FitClub/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Esperar a que la web sirva el despliegue nuevo
        # GitHub Pages tarda un poco en servir los ficheros nuevos después de
        # publicar. Las pruebas que RECARGAN la app (S8) pueden coger el cambio a
        # medias y dar un fallo falso: el navegador pide un bundle que acaba de
        # desaparecer y la pantalla queda en blanco (el mecanismo del INC-012).
        # Un falso rojo es peor que no tener pruebas, porque enseña a ignorarlas.
        run: |
          BASE="$BASE_URL"
          for intento in $(seq 1 10); do
            HTML=$(curl -s --max-time 20 "$BASE")
            JS=$(echo "$HTML" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
            if [ -n "$JS" ] && curl -sf -o /dev/null --max-time 20 "$BASE$JS"; then
              echo "La web ya sirve su bundle ($JS)."
              exit 0
            fi
            echo "Intento $intento: el despliegue aún no está servido del todo; espero 8s."
            sleep 8
          done
          echo "La web no termina de servir su bundle: las pruebas darían falsos fallos."
          exit 1
      - name: Batería de smoke tests contra el despliegue
        # Si lo que se acaba de publicar es la VISTA PREVIA, las pruebas van contra
        # ella: eso es lo que hay que comprobar antes de que lo vea nadie. Si no,
        # contra la web real.
        #
        # Y se sacan de la MISMA rama que se publica como vista previa. Antes salían
        # siempre de `main`, y eso tenía un agujero: un test nuevo escrito en la rama
        # de vista previa NO se ejecutaba hasta publicarlo (se descubrió con los de
        # la app instalable, que hubo que pasar a mano). Para la app real sigue
        # siendo `main`, que es exactamente lo que se publica.
        working-directory: ${{ needs.build.outputs.hay_vista == 'si' && '_vista' || '.' }}
        run: npx playwright test --reporter=list
      - name: Vigilante de la web publicada (sitio y reglas)
        # Comprueba que la web está en pie, que los ficheros publicados son del
        # MISMO despliegue (caza el INC-013) y que las reglas siguen cerradas
        # (esto último no lo mira la batería de navegador).
        run: node scripts/health-check.mjs
      - name: Publicar informe de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: |
            test-reports/
            test-results/
          retention-days: 30
